<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Empréstimo - BOA OPÇÃO</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">
                <img src="imagens/logo.png" alt="Logo" width="40" height="40" class="d-inline-block align-text-top me-2">
                <span id="orgName">BOA OPÇÃO</span>
                <small class="d-block text-white-50" id="orgSubName">SOLUÇÕES DE CRÉDITO</small>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#cadastro">Novo Cadastro</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#consulta">Consultar</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Status da Organização -->
    <div class="container mt-3">
        <div id="statusOrg" class="alert alert-dismissible fade show" style="display: none;">
            <span id="statusMessage"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    </div>

    <!-- Formulário de Cadastro -->
    <div class="container my-5" id="cadastro">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0"><i class="bi bi-person-plus"></i> Cadastro de Empréstimo</h3>
                    </div>
                    <div class="card-body">
                        <form id="formEmprestimo">
                            <div class="row g-3">
                                <!-- Nome -->
                                <div class="col-md-6">
                                    <label for="nome" class="form-label">Nome Completo *</label>
                                    <input type="text" class="form-control" id="nome" name="nome" required 
                                           placeholder="Digite o nome completo">
                                </div>

                                <!-- CPF -->
                                <div class="col-md-6">
                                    <label for="cpf" class="form-label">CPF *</label>
                                    <input type="text" class="form-control" id="cpf" name="cpf" required 
                                           placeholder="000.000.000-00" maxlength="14">
                                </div>

                                <!-- Número -->
                                <div class="col-md-6">
                                    <label for="numero" class="form-label">Número *</label>
                                    <input type="tel" class="form-control" id="numero" name="numero" required 
                                           placeholder="(00) 00000-0000">
                                </div>

                                <!-- PIX -->
                                <div class="col-md-6">
                                    <label for="pix" class="form-label">Chave PIX</label>
                                    <input type="text" class="form-control" id="pix" name="pix" 
                                           placeholder="CPF/Email/Telefone">
                                </div>

                                <!-- Banco -->
                                <div class="col-md-6">
                                    <label for="banco" class="form-label">Banco *</label>
                                    <select class="form-select" id="banco" name="banco" required>
                                        <option value="">Selecione o banco...</option>
                                        <option value="001">Banco do Brasil</option>
                                        <option value="104">Caixa Econômica Federal</option>
                                        <option value="237">Bradesco</option>
                                        <option value="341">Itaú</option>
                                        <option value="033">Santander</option>
                                        <option value="260">Nubank</option>
                                        <option value="077">Inter</option>
                                        <option value="336">C6 Bank</option>
                                    </select>
                                </div>

                                <!-- Valor Cartão -->
                                <div class="col-md-6">
                                    <label for="valorCartao" class="form-label">Valor do Cartão *</label>
                                    <div class="input-group">
                                        <span class="input-group-text">R$</span>
                                        <input type="number" class="form-control" id="valorCartao" name="valorCartao" 
                                               required placeholder="0.00" step="0.01" min="0">
                                    </div>
                                </div>

                                <!-- Parcelas -->
                                <div class="col-md-6">
                                    <label for="parcelas" class="form-label">Parcelas *</label>
                                    <input type="number" class="form-control" id="parcelas" name="parcelas" 
                                           required placeholder="Quantidade de parcelas" min="1" max="96">
                                </div>

                                <!-- Valor Emprestado -->
                                <div class="col-md-6">
                                    <label for="valorEmprestado" class="form-label">Valor Emprestado *</label>
                                    <div class="input-group">
                                        <span class="input-group-text">R$</span>
                                        <input type="number" class="form-control" id="valorEmprestado" 
                                               name="valorEmprestado" required placeholder="0.00" step="0.01" min="0">
                                    </div>
                                </div>

                                <!-- Upload de Documentos -->
                                <div class="col-md-6">
                                    <label for="fichaCliente" class="form-label">Ficha do Cliente</label>
                                    <input type="file" class="form-control" id="fichaCliente" accept="image/*" 
                                           capture="environment">
                                </div>

                                <div class="col-md-6">
                                    <label for="documentoCliente" class="form-label">Documento do Cliente</label>
                                    <input type="file" class="form-control" id="documentoCliente" accept="image/*" 
                                           capture="environment">
                                </div>

                                <!-- Preview das imagens -->
                                <div class="col-12">
                                    <div class="row mt-2" id="previewContainer" style="display: none;">
                                        <div class="col-md-6">
                                            <label class="form-label">Preview Ficha:</label>
                                            <img id="previewFicha" class="img-thumbnail preview-img" alt="Preview Ficha">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Preview Documento:</label>
                                            <img id="previewDocumento" class="img-thumbnail preview-img" 
                                                 alt="Preview Documento">
                                        </div>
                                    </div>
                                </div>

                                <!-- Botões -->
                                <div class="col-12 mt-3">
                                    <button type="submit" class="btn btn-primary btn-lg w-100" id="btnSubmit">
                                        <i class="bi bi-check-circle"></i> Cadastrar Empréstimo
                                    </button>
                                    <button type="button" class="btn btn-secondary btn-lg w-100 mt-2" 
                                            onclick="limparFormulario()">
                                        <i class="bi bi-arrow-counterclockwise"></i> Limpar Formulário
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Seção de Consulta -->
    <div class="container my-5" id="consulta">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow">
                    <div class="card-header bg-info text-white">
                        <h3 class="mb-0"><i class="bi bi-search"></i> Consultar Empréstimos</h3>
                    </div>
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-md-8">
                                <input type="text" class="form-control" id="searchCPF" 
                                       placeholder="Buscar por CPF...">
                            </div>
                            <div class="col-md-4">
                                <button class="btn btn-info w-100" onclick="buscarEmprestimos()">
                                    <i class="bi bi-search"></i> Buscar
                                </button>
                            </div>
                        </div>
                        <div id="resultadosConsulta" class="table-responsive">
                            <!-- Resultados serão carregados aqui -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">&copy; 2024 BOA OPÇÃO - Soluções de Crédito. Todos os direitos reservados.</p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
